name: stress

# Hunts intermittent hangs: lab/brush-smoke/stress.py runs a set of scripts through sill many
# times with a timeout, and shows the process tree of any run that hangs.
on:
  workflow_dispatch:
    inputs:
      sill_tag:
        description: "sill release tag (empty = latest release; nightly = current source; run:ID = a build run's artifact)"
        default: ""
      count:
        description: "Runs per script"
        default: "200"

permissions:
  contents: read

jobs:
  stress:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SILL_DOWNLOAD_TOKEN: ${{ secrets.SILL_DOWNLOAD_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get sill
        id: sill
        shell: pwsh
        run: |
          $bash = pwsh scripts/get-sill.ps1 -Tag "${{ inputs.sill_tag }}"
          "bash=$bash" | Add-Content $env:GITHUB_OUTPUT
          & $bash --version
      - name: Stress
        shell: pwsh
        run: |
          python -X utf8 lab\brush-smoke\stress.py --shell "${{ steps.sill.outputs.bash }}" --count ${{ inputs.count }} --out stress.md
          $code = $LASTEXITCODE
          Get-Content stress.md -Encoding utf8 | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stress
          path: stress.md
          if-no-files-found: warn
