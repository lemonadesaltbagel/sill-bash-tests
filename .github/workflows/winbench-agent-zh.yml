name: winbench-agent-zh

# The Windows-boundary tasks on a Chinese-locale Windows (system locale zh-CN, ANSI code page
# 936), where encoding problems are real: agents run inside a Windows container with that
# locale (GitHub's runners are en-US and can't reboot to change it). The host's Git, Node,
# Python, .NET and sill are mounted at their usual paths. MSVC can't be, so its task is left out.
on:
  workflow_dispatch:
    inputs:
      harness:
        description: "claude or opencode"
        default: "claude"
      envs:
        description: "JSON list of shells: sill, gitbash, powershell"
        default: '["sill","gitbash","powershell"]'
      shards:
        description: "JSON list of I/N shards"
        default: '["1/2","2/2"]'
      tasks:
        description: "Comma-separated task ids (empty = all but msvc-cmake-tests)"
        default: ""
      reps:
        description: "Runs per task"
        default: "3"
      sill_tag:
        description: "sill release tag (empty = latest release; nightly = current source; run:ID = a build run's artifact)"
        default: ""
      resume:
        description: "Earlier runs of this workflow, comma-separated, newest first: keep their counted runs"
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(inputs.envs) }}
        shard: ${{ fromJSON(inputs.shards) }}
    runs-on: windows-2022
    timeout-minutes: 330
    env:
      SILL_DOWNLOAD_TOKEN: ${{ secrets.SILL_DOWNLOAD_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Get sill
        id: sill
        shell: pwsh
        run: |
          $bash = pwsh scripts/get-sill.ps1 -Tag "${{ inputs.sill_tag }}"
          "bash=$bash" | Add-Content $env:GITHUB_OUTPUT
          "dir=$(Split-Path (Split-Path $bash))" | Add-Content $env:GITHUB_OUTPUT
      - name: A Windows container with the zh-CN system locale
        shell: pwsh
        run: |
          $image = 'mcr.microsoft.com/windows/servercore:ltsc2022'
          docker pull -q $image
          $set = "Set-WinSystemLocale -SystemLocale zh-CN; Set-Culture zh-CN; Set-WinUserLanguageList zh-CN -Force; " +
                 "`$k = 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage'; " +
                 "Set-ItemProperty `$k ACP '936'; Set-ItemProperty `$k OEMCP '936'"
          docker run --name setlocale $image powershell -NoProfile -Command $set
          docker commit setlocale sill-zh | Out-Null
          $acp = docker run --rm sill-zh powershell -NoProfile -Command "[Text.Encoding]::Default.CodePage"
          if ("$acp".Trim() -ne '936') { throw "the container reports code page $acp" }
      - name: Previous results
        if: inputs.resume != ''
        shell: pwsh
        run: |
          $name = "e2e-${{ matrix.env }}-${{ matrix.shard }}".Replace('/', 'of')
          $i = 0
          foreach ($id in "${{ inputs.resume }}".Split(',')) {
            gh run download $id.Trim() -R ${{ github.repository }} -n $name -D "prev$i"
            if ($LASTEXITCODE) { Write-Output "no earlier results for $name in run $id"; $global:LASTEXITCODE = 0 }
            $i++
          }
      - name: Run tasks in the container
        shell: pwsh
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          $shard = "${{ matrix.shard }}".Replace('/', 'of')
          $tasks = "${{ inputs.tasks }}"
          if (-not $tasks) {
            $tasks = (python -c "import sys; sys.path.insert(0, 'lab/bench'); import winbench_tasks as w; print(','.join(t['id'] for t in w.TASKS if t['id'] != 'msvc-cmake-tests'))")
          }
          New-Item -ItemType Directory -Force D:\wbo | Out-Null
          $previous = @()
          foreach ($d in Get-ChildItem -Directory -Filter 'prev*' | Sort-Object { [int]($_.Name.Substring(4)) }) {
            $p = Join-Path $d.FullName "${{ matrix.env }}-$shard"
            if (Test-Path "$p\results.json") {
              $dest = "D:\wbo\prev-$($d.Name)"; Copy-Item -Recurse $p $dest; $previous += @('--previous', "C:\wbo\prev-$($d.Name)")
            }
          }
          $py = Split-Path (Get-Command python).Source
          $sill = "${{ steps.sill.outputs.dir }}"
          $out = "C:\wbo\${{ matrix.env }}-$shard"
          $runArgs = @('--task-source', 'winbench', '--shard', '${{ matrix.shard }}', '--timeout', '900', '--max-turns', '100',
                       '--env', '${{ matrix.env }}', '--harness', '${{ inputs.harness }}', '--sill-bash', "C:\sill\sill\bash.exe",
                       '--out', $out, "--tasks=$tasks", '--reps', '${{ inputs.reps }}') + $previous
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            docker run --rm `
              -v "${PWD}:C:\w" -w C:\w -v "D:\wbo:C:\wbo" -v "${sill}:C:\sill" `
              -v "${py}:${py}" -v "C:\Program Files\Git:C:\Program Files\Git" `
              -v "C:\Program Files\nodejs:C:\Program Files\nodejs" -v "C:\Program Files\dotnet:C:\Program Files\dotnet" `
              -e "HOST_PYTHON=$py" -e "HARNESS=${{ inputs.harness }}" -e "RUN_ARGS=$($runArgs -join '|')" `
              -e DEEPSEEK_API_KEY `
              sill-zh powershell -NoProfile -ExecutionPolicy Bypass -File lab\bench\container_run.ps1
            if (Test-Path "D:\wbo\${{ matrix.env }}-$shard\summary.md") { break }
            Write-Output "the runner stopped early (attempt $attempt); resuming from its own results"
            $runArgs = $runArgs + @('--previous', $out)
          }
          New-Item -ItemType Directory -Force "out\${{ matrix.env }}-$shard" | Out-Null
          Copy-Item "D:\wbo\${{ matrix.env }}-$shard\*.json*", "D:\wbo\${{ matrix.env }}-$shard\summary.md" "out\${{ matrix.env }}-$shard\"
          Get-Content "out\${{ matrix.env }}-$shard\summary.md" | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Name the results
        if: always()
        id: name
        shell: pwsh
        run: '"name=" + "e2e-${{ matrix.env }}-${{ matrix.shard }}".Replace("/", "of") | Add-Content $env:GITHUB_OUTPUT'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          retention-days: 14
          path: |
            out/*/*.jsonl
            out/*/results.json
            out/*/summary.md

  report:
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-*
          path: results
      - run: python3 lab/agent-e2e/compare.py report.md results/*/*
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: report.md
